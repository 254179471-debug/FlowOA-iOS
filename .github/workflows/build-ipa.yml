name: Build FlowOA iOS (signed IPA)

# 用 GitHub 免费的 macOS 机器编译并签名，产出可直接安装的 .ipa
# 签名材料通过仓库 Secrets 注入（不会出现在代码/日志里）：
#   IOS_P12_BASE64        : 开发/分发证书导出的 .p12，base64 编码
#   IOS_CERT_PASSWORD     : .p12 的导出密码
#   IOS_PROVISIONING_BASE64: .mobileprovision 描述文件，base64 编码
# 三个 Secret 都设置后自动走"签名"流程；缺任一则回退为未签名 ipa。
on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 也可以在 Actions 页面手动点按钮触发

jobs:
  build:
    name: Build & sign IPA
    runs-on: macos-15   # Xcode 16，能读 xcodegen 生成的格式(objectVersion 77)；macos-14 默认 Xcode 15.4 会报 "future Xcode project file format (77)"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 安装签名证书与描述文件（仅当 Secret 齐全时）
        if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROVISIONING_BASE64 != '' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_BASE64: ${{ secrets.IOS_PROVISIONING_BASE64 }}
        run: |
          set -o pipefail
          KEYCHAIN_PW=$(openssl rand -base64 24)
          echo "$IOS_P12_BASE64" | base64 --decode > cert.p12
          echo "$IOS_PROVISIONING_BASE64" | base64 --decode > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: 编译（签名）
        if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROVISIONING_BASE64 != '' }}
        env:
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -o pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain 2>/dev/null | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "使用签名身份: $IDENTITY"
          xcodebuild \
            -project FlowOA.xcodeproj \
            -scheme FlowOA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${IDENTITY:-iPhone Developer}" \
            PROVISIONING_PROFILE="$PWD/profile.mobileprovision" \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 编译（跳过签名，未配置证书时回退）
        if: ${{ secrets.IOS_P12_BASE64 == '' || secrets.IOS_PROVISIONING_BASE64 == '' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project FlowOA.xcodeproj \
            -scheme FlowOA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 打包成 .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FlowOA.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到编译产物 $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry FlowOA-unsigned.ipa Payload
          cd ..
          ls -lh out/FlowOA-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: FlowOA-signed-ipa
          path: out/FlowOA-unsigned.ipa
          retention-days: 30
